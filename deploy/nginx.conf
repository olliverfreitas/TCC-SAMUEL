# Nginx como proxy reverso na frente do Node.
# Copiar para /etc/nginx/sites-available/plataforma e criar o link simbolico
# em /etc/nginx/sites-enabled/. Depois, o certbot --nginx acrescenta sozinho o
# bloco HTTPS (porta 443) e o redirecionamento de HTTP para HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name vidacuida.tech www.vidacuida.tech;

    # Nenhum formulario do site envia arquivo; 1 MB sobra para o maior artigo
    # do admin e corta requisicao gigante antes de chegar no Node.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
